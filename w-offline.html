<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldMath - Offline</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:#1a2332;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .container{text-align:center;padding:2rem;max-width:480px}
  .icon{font-size:4rem;margin-bottom:1rem}
  h1{font-size:1.75rem;color:#f97316;margin-bottom:0.75rem}
  p{font-size:1.1rem;color:#94a3b8;margin-bottom:1.5rem;line-height:1.6}
  ul{list-style:none;text-align:left;display:inline-block}
  ul li{padding:0.4rem 0;font-size:0.95rem}
  ul li::before{content:'✓ ';color:#f97316;font-weight:700}
  .btn{display:inline-block;margin-top:1.5rem;padding:0.75rem 1.5rem;background:#f97316;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;transition:background 0.2s}
  .btn:hover{background:#ea580c}
</style>
</head>
<body>
<div class="container">
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>But many calculators still work!</p>
  <ul>
    <li>Basic math calculators</li>
    <li>Unit converters</li>
    <li>Area &amp; volume tools</li>
    <li>Cost estimators</li>
    <li>Material calculators</li>
  </ul>
  <a class="btn" href="/">Try Homepage</a>
</div>
</body>
</html>
